
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Python
        run: python --version

      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      - name: Check Django project
        working-directory: server
        run: |
          python -m pip install Django
          python manage.py check

      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm install

      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build
